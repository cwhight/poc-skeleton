# CI test-gate. Tests are a HARD merge gate — PRs cannot merge unless this is
# green. Three jobs run in parallel on every PR to main:
#   - api:   go vet + go test ./...          (Go on latest stable)
#   - web:   lint + typecheck + build        (Next.js)
#   - infra: terraform fmt -check + validate  (no backend/creds needed)
# No deploy here — deploy.yml handles main.
#
# Make each job a required status check in branch protection so a red run blocks
# the merge button (the test-gate is only real if it's required).
name: ci

on:
  pull_request:
    branches: [main]
  # Reused by deploy.yml so main never deploys an untested commit.
  workflow_call:

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api/
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - name: Vet code
        run: go vet ./...
      - name: Run tests
        run: go test ./...

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build

  infra:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
      - name: Check formatting
        run: terraform fmt -check -recursive
      - name: Initialize Terraform (no backend)
        run: terraform init -backend=false
      - name: Validate configuration
        run: terraform validate
